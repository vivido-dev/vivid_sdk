[package]
name = "vivid_audio"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "Bounded native audio decoding and resampling for Vivid application hosts"

[workspace]

[dependencies]
libc = "0.2"
vivid_protocol = { version = "1.5.12", path = "../../vivid_protocol", default-features = false }
vivid_video = { version = "0.1.0", path = "../video" }

[build-dependencies]
pkg-config = "0.3"

[dev-dependencies]
serde_json = "1"
