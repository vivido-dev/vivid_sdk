[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "vivid-sdk"
version = "1.5.0"
description = "Typed Python bindings for the Vivid Protocol 1.5 producer SDK"
readme = "README-python.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Wensheng Wang", email = "wenshengwang@gmail.com" }]
keywords = ["terminal", "graphics", "media", "protocol"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/vivido-dev/vivid_sdk"

[project.optional-dependencies]
test = ["mypy>=1.8,<2", "pytest>=7.4"]

[tool.maturin]
manifest-path = "python-bindings/Cargo.toml"
python-source = "python"
module-name = "vivid_sdk._native"
bindings = "pyo3"

[tool.pytest.ini_options]
testpaths = ["python-tests"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["python/vivid_sdk", "python-tests"]

[[tool.mypy.overrides]]
module = ["pytest", "pytest.*"]
follow_imports = "skip"
