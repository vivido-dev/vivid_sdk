[package]
name = "vivid_coreaudio_fixture"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false
description = "Private CoreAudio endpoint fixture for native lifecycle checks"


[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18"
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["AudioHardware"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFArray", "CFDictionary", "CFNumber", "CFString"] }
