[package]
name = "vivid-sdk-python"
version = "1.5.1"
edition = "2024"
rust-version = "1.87.0"
license = "Apache-2.0"
description = "Private PyO3 extension for the vivid-sdk Python package"
repository = "https://github.com/vivido-dev/vivid_sdk"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }
vivid_protocol = { version = "1.5", path = "../../vivid_protocol" }
# The wheel carries both roles: one artifact, a producer and a presenter.
vivid_sdk = { version = "1.5", path = "..", features = ["presenter"] }
zeroize = "1.9"
