[package]
name = "vivid-sdk-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "Apache-2.0"
description = "Private PyO3 extension for the vivid-sdk Python package"
repository = "https://github.com/vivido-dev/vivid_sdk"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }
vivid_protocol = { version = "1.3", path = "../../vivid_protocol" }
vivid_sdk = { version = "0.1.1", path = ".." }
