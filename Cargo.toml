[package]
name = "vivid_sdk"
version = "0.2.0"
authors = ["Wensheng Wang <wenshengwang@gmail.com>"]
edition = "2024"
rust-version = "1.85.0"
license = "Apache-2.0"
description = "Reusable full-duplex Vivid Protocol producer client"
repository = "https://github.com/vivido-dev/vivid_sdk"

[dependencies]
crossterm = "0.29"
getrandom = "0.4"
vivid_protocol = { version = "1.4", path = "../vivid_protocol" }

[dev-dependencies]
tempfile = "3"

[workspace]
members = ["python-bindings"]
resolver = "3"
