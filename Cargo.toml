[package]
name = "vivid_sdk"
version = "1.5.10"
authors = ["Wensheng Wang <wenshengwang@gmail.com>"]
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "Reusable full-duplex Vivid Protocol 1.5 producer and presenter SDK"
readme = "README.md"
repository = "https://github.com/vivido-dev/vivid_sdk"

# The Python, Node, and Lua bindings have their own release channels (PyPI/npm/LuaRocks). Keep
# them and their tooling out of the Rust crate.
exclude = [
  "python",
  "python-bindings",
  "python-tests",
  "node",
  "node-bindings",
  "ts",
  "package.json",
  "npm",
  "pyproject.toml",
  "uv.lock",
  "README-python.md",
  "README-typescript.md",
  ".pytest_cache",
  "lua",
  "lua-bindings",
  "lua-tests",
  "README-lua.md",
  "*.rockspec",
]

[features]
default = ["native-media"]
native-media = ["vivid_protocol/native"]
# The terminating presenter. Off by default: most consumers only produce, and it roughly doubles
# the crate. It does not require `native-media` — a build without it simply refuses compressed
# raster frames at runtime, exactly as the producer side does.
presenter = ["dep:log", "dep:serde", "dep:sha2"]
# An in-process Vivid 1.5 presenter fake for producer tests, plus the presenter test-support API
# gateway consumers drive from their own suites. Off by default: it is only compiled into crates
# that ask for it, and it never affects a production build of the SDK. Requires `presenter`: its
# overlay window/focus/revision bookkeeping is shared with the real terminating presenter, so a
# producer-side regression against this fake and against a live host agree on the same state.
testing = ["presenter"]

[dependencies]
getrandom = "0.4"
log = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
sha2 = { version = "0.11", optional = true }
vivid_protocol = { version = "1.5", path = "../vivid_protocol", default-features = false, features = [
  "native-transport",
] }
zeroize = "1.9"

[dev-dependencies]
tempfile = "3"

# The conformance example prints JSON that a cross-language runner reads; nothing in the crate
# itself depends on serde.
serde_json = "1"

[[example]]
name = "conformance"
path = "examples/rust/conformance.rs"
required-features = ["presenter"]

[workspace]
members = ["python-bindings", "node-bindings"]
resolver = "3"

[[example]]
name = "sdk_01_show_image"
path = "examples/rust/01_show_image.rs"

[[example]]
name = "sdk_02_generated_raster"
path = "examples/rust/02_generated_raster.rs"

[[example]]
name = "sdk_03_surface_and_track"
path = "examples/rust/03_surface_and_track.rs"

[[example]]
name = "sdk_04_raster_animation"
path = "examples/rust/04_raster_animation.rs"

[[example]]
name = "sdk_05_replace_track"
path = "examples/rust/05_replace_track.rs"

[[example]]
name = "sdk_06_presenter_roundtrip"
path = "examples/rust/06_presenter_roundtrip.rs"
required-features = ["presenter"]

[[example]]
name = "sdk_07_overlay_window"
path = "examples/rust/07_overlay_window.rs"

[[example]]
name = "sdk_08_overlay_paths"
path = "examples/rust/08_overlay_paths.rs"
