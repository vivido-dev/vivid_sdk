[package]
name = "vivid_sdk"
version = "1.5.13"
authors = ["Wensheng Wang <wenshengwang@gmail.com>"]
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "Reusable full-duplex Vivid Protocol 1.5 producer and presenter SDK"
readme = "README.md"
repository = "https://github.com/vivido-dev/vivid_sdk"

# The Python, Node, and Lua bindings have their own release channels (PyPI/npm/LuaRocks). Keep
# them and their tooling out of the Rust crate.
exclude = [
  "python",
  "python-bindings",
  "python-tests",
  "node",
  "node-bindings",
  "ts",
  "package.json",
  "npm",
  "pyproject.toml",
  "uv.lock",
  "README-python.md",
  "README-typescript.md",
  ".pytest_cache",
  "lua",
  "lua-bindings",
  "lua-tests",
  "README-lua.md",
  "*.rockspec",
]

[features]
# Bounded platform-neutral readable text snapshots; no GUI or device dependency.
accessible-text = []
# Optional native audio decoder/resampler; no GUI, presenter or device dependency.
audio-decode = ["dep:vivid_audio"]
# Device output and clocks are independent of FFmpeg, GUI and presenter roles.
audio-output = ["dep:vivid_audio_output"]
audio-output-testing = ["audio-output", "vivid_audio_output/testing"]
# Optional native elementary-video decoder; no GUI or presenter dependency.
video-decode = ["dep:vivid_video"]
# Native video scene nodes with live and timed presentation.
vector-video = ["vector-render", "video-decode", "dep:moxcms"]
# Per-source native audio workers for local pane presentation.
vector-audio = ["vector-render", "audio-decode", "audio-output"]
# Native same-owner control sockets/pipes, independent of Vivid wire authority and GUI.
local-control = ["dep:vivid_local_control"]
# Experimental bounded Metal/IOSurface frame sharing; does not enable GUI.
gpu-share = ["dep:vivid_gpu_share"]
gpu-share-testing = ["gpu-share", "vivid_gpu_share/test-util"]
# Shared portable display-list compilation; independent of GPUI and a GPU device.
vector-render = [
  "dep:vello",
  "dep:parley",
  "dep:bytemuck",
  "dep:unicode-segmentation",
  "dep:icu_properties",
  "dep:skrifa",
]
# Bounded PNG/JPEG decoding on a separate native presenter worker.
vector-images = ["vector-render", "dep:image", "dep:moxcms", "dep:crc32fast"]
# Shared GPU composition types; checked output requires vector-texture.
vector-gpu = ["vector-render", "dep:wgpu", "vello/wgpu"]
# Checked GPU texture exports on a host-owned device; no adapter or GUI creation.
vector-texture = ["vector-gpu", "dep:vivid_vello_backend"]
# Native adapter and bounded asynchronous CPU readback for hosted GUI images.
vector-offscreen = [
  "vector-texture",
  "vello/debug_layers",
  "wgpu/metal",
  "wgpu/vulkan",
  "wgpu/dx12",
]
# Desktop GUI runtime is opt-in; protocol consumers retain their existing dependency graph.
gui = [
  "accessible-text",
  "dep:gpui",
  "dep:gpui_platform",
  "dep:serde",
  "dep:serde_json",
  "dep:async-channel",
  "vivid_gpu_share?/gui",
]
# Compile Metal shaders at runtime when the Xcode Metal command-line tool is absent.
gui-runtime-shaders = ["gui", "gpui_platform/runtime_shaders"]
# Production frame readback without enabling deterministic test runtimes.
gui-offscreen = ["gui", "gpui/offscreen", "gpui_platform/offscreen"]
# Production GUI application rendered into an authenticated desktop surface.
gui-remote = ["gui-offscreen", "local-control", "dep:url", "dep:futures-channel"]
# Optional Linux nested Wayland server; independent of Vivid wire authority.
gui-wayland = [
  "gui",
  "dep:smithay",
  "dep:tempfile",
  "dep:rustix",
  "dep:wayland-backend",
]
# Deterministic GUI contexts for host lifecycle integration tests.
gui-testing = ["gui", "gpui/test-support", "gpui_platform/test-support"]
default = ["native-media"]
native-media = ["vivid_protocol/native"]
# The terminating presenter. Off by default: most consumers only produce, and it roughly doubles
# the crate. It does not require `native-media` — a build without it simply refuses compressed
# raster frames at runtime, exactly as the producer side does.
presenter = ["dep:log", "dep:serde", "dep:sha2"]
# An in-process Vivid 1.5 presenter fake for producer tests, plus the presenter test-support API
# gateway consumers drive from their own suites. Off by default: it is only compiled into crates
# that ask for it, and it never affects a production build of the SDK. Requires `presenter`: its
# overlay window/focus/revision bookkeeping is shared with the real terminating presenter, so a
# producer-side regression against this fake and against a live host agree on the same state.
testing = ["presenter", "vivid_audio_output?/testing"]

[dependencies]
url = { version = "2.5", optional = true }
vivid_gpu_share = { version = "0.1.0", path = "gpu-share", optional = true, default-features = false }
futures-channel = { version = "0.3", optional = true }
async-channel = { version = "2.5", optional = true }
vivid_audio = { version = "0.1.0", path = "audio", optional = true }
vivid_audio_output = { version = "0.1.0", path = "audio-output", optional = true }
vivid_video = { version = "0.1.0", path = "video", optional = true }
vivid_local_control = { version = "0.1.0", path = "local-control", optional = true }
moxcms = { version = "0.9", optional = true }
crc32fast = { version = "1.5", optional = true }
image = { version = "0.25.10", optional = true, default-features = false, features = [
  "png",
  "jpeg",
] }
skrifa = { version = "0.49", optional = true }
icu_properties = { version = "2.3", optional = true }
unicode-segmentation = { version = "1.12", optional = true }
bytemuck = { version = "1.25", optional = true }
parley = { version = "0.12", path = "vendor/parley", optional = true, features = [
  "bytemuck",
  "complex-scripts",
] }
vello = { version = "=0.12.0", optional = true, default-features = false }
vivid_vello_backend = { version = "0.12.0-vivid.1", path = "vendor/vello-backend", optional = true, default-features = false, features = [
  "wgpu",
  "debug_layers",
] }
wgpu = { version = "30.0", optional = true, default-features = false, features = [
  "std",
  "wgsl",
] }
gpui = { path = "gui/crates/gpui", optional = true, default-features = false }
gpui_platform = { path = "gui/crates/gpui_platform", optional = true, default-features = false, features = [
  "font-kit",
  "wayland",
] }
getrandom = "0.4"
log = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive", "rc"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.11", optional = true }
vivid_protocol = { version = "1.5.13", path = "../vivid_protocol", default-features = false, features = [
  "native-transport",
] }
zeroize = "1.9"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", optional = true, features = ["fs", "event", "net"] }
smithay = { path = "vendor/smithay", optional = true, default-features = false, features = [
  "wayland_frontend",
  "renderer_pixman",
] }
tempfile = { version = "3", optional = true }
wayland-backend = { path = "vendor/wayland/wayland-backend", optional = true }

[dev-dependencies]
pollster = "1"
tempfile = "3"
# `test-util` lets the presenter tests send a preface that claims another protocol version.
vivid_protocol = { version = "1.5.13", path = "../vivid_protocol", default-features = false, features = [
  "native-transport",
  "test-util",
] }

# Producer-only conformance builds print JSON without enabling GUI/presenter serialization.
serde_json = "1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
wayland-client = { path = "vendor/wayland/wayland-client" }
wayland-protocols = { path = "vendor/wayland/wayland-protocols", features = [
  "client",
] }

# A std-only send-path benchmark: `cargo bench --bench send`. The adaptive raster scenarios need
# zstd.
[[bench]]
name = "send"
harness = false
required-features = ["native-media"]

[[example]]
name = "conformance"
path = "examples/rust/conformance.rs"
required-features = ["presenter"]

[workspace]
members = ["python-bindings", "node-bindings"]
resolver = "3"
exclude = [
  "gui",
  "local-control",
  "video",
  "audio",
  "audio-output",
  "gpu-share",
  "vendor/smithay",
  "vendor/wayland",
  "vendor/parley",
  "vendor/vello-backend",
]

[[example]]
name = "sdk_01_show_image"
path = "examples/rust/01_show_image.rs"

[[example]]
name = "sdk_02_generated_raster"
path = "examples/rust/02_generated_raster.rs"

[[example]]
name = "sdk_03_surface_and_track"
path = "examples/rust/03_surface_and_track.rs"

[[example]]
name = "sdk_04_raster_animation"
path = "examples/rust/04_raster_animation.rs"

[[example]]
name = "sdk_05_replace_track"
path = "examples/rust/05_replace_track.rs"

[[example]]
name = "sdk_06_presenter_roundtrip"
path = "examples/rust/06_presenter_roundtrip.rs"
required-features = ["presenter"]

[[example]]
name = "sdk_07_overlay_window"
path = "examples/rust/07_overlay_window.rs"

[[example]]
name = "sdk_08_overlay_paths"
path = "examples/rust/08_overlay_paths.rs"

[[example]]
name = "sdk_gui_offscreen_roundtrip"
path = "examples/rust/gui_offscreen_roundtrip.rs"
required-features = ["gui-offscreen", "presenter"]

[[example]]
name = "sdk_gui_remote_counter"
path = "examples/rust/gui_remote_counter.rs"
required-features = ["gui-remote"]
